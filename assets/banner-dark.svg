<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.95"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
<style>.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; } .eyebrow { font-size: 15px; letter-spacing: 4.2px; fill: #22d3ee; font-weight: 600; } .name    { font-size: 84px; letter-spacing: -2px; fill: #e8eef7; font-weight: 700; } .edge  { stroke: #232c4a; stroke-width: 1.15; } /* A spike crossing one gap. Each edge carries one per cycle, delayed by its layer, so activity sweeps left to right and only about a quarter of the edges are lit at any instant - lighting them all at once is what made the first version look busy. */ .spark { stroke: url(#fade); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 14 86; stroke-dashoffset: 100; opacity: 0; animation: travel 4.8s linear infinite; } @keyframes travel { 0%   { stroke-dashoffset: 100; opacity: 0; } 3%   { opacity: 1; } 17.7% { stroke-dashoffset: 0; opacity: 1; } 20.7%, 100% { stroke-dashoffset: 0; opacity: 0; } } /* Only the fill is animated, not the radius: Firefox gained CSS geometry properties (r, cx, cy) only recently, and a node that never lights up for a chunk of visitors is worse than one that lights without growing. */ .node { fill: #38456b; animation: fire 4.8s ease-out infinite; } @keyframes fire { 0%   { fill: #38456b; } 4%   { fill: #22d3ee; } 22%  { fill: #38456b; } 100% { fill: #38456b; } } .cursor { fill: #22d3ee; animation: blink 1.15s steps(1) infinite; } @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } } @media (prefers-reduced-motion: reduce) { .cursor, .pulse, .spark, .node { animation: none; } .spark { opacity: 0; } } /* A short lit segment chased around the card's own outline. pathLength normalises the perimeter to 100 so the dash numbers stay readable. */ .pulse { stroke: #22d3ee; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 11 89; stroke-dashoffset: 100; animation: chase 4.8s linear infinite; } @keyframes chase { to { stroke-dashoffset: 0; } }</style>
